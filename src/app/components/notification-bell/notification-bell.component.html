<div class="bell" [class.medico]="theme() === 'medico'">
  <button type="button" class="bell-btn" (click)="toggle(); $event.stopPropagation()"
    [attr.aria-expanded]="abierta()" aria-label="Notificaciones" title="Notificaciones">
    <svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"
        fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"
        fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="dot" [class.unread]="noLeidas() > 0"></span>
  </button>

  @if (abierta()) {
    <div class="panel" role="dialog" aria-label="Tus notificaciones" (click)="$event.stopPropagation()">
      <header>
        <strong>Notificaciones</strong>
        @if (noLeidas() > 0) {
          <button type="button" class="link" (click)="leerTodas()">Marcar leídas</button>
        }
      </header>
      @if (items().length === 0) {
        <p class="empty">No tienes avisos todavía.</p>
      } @else {
        <ul>
          @for (n of items(); track n.id) {
            <li [class.unread]="!n.leida" (click)="leer(n)">
              <strong>{{ n.titulo }}</strong>
              <p>{{ n.mensaje }}</p>
              <small>{{ n.creadaEn | date:'short' }}</small>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
